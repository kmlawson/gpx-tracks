; Applies to PHP-FPM / CGI setups (PHP reads .user.ini per directory).
; Mirrors the 25 MB application limit in lib.php, with headroom for the
; multipart envelope, and keeps error text out of API responses.
upload_max_filesize = 26M
post_max_size = 27M
max_file_uploads = 2
display_errors = Off
html_errors = Off
max_execution_time = 120
memory_limit = 256M
; expose_php is PHP_INI_SYSTEM — it cannot be set per directory. Turn it off in
; php.ini, or strip X-Powered-By at the web server. The API endpoints remove the
; header themselves in security_headers().
